name = "gleewright"
version = "1.0.0"
target = "javascript"
gleam = ">= 1.14.0"

description = "Playwright-powered end-to-end testing for Gleam"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "gleewright" }
links = [{ title = "Playwright", href = "https://playwright.dev" }]

[javascript]
runtime = "node"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[documentation]
pages = [{ title = "Changelog", path = "changelog.html", source = "./CHANGELOG.md" }]
