name: test

on:
  pull_request:
  # Pushes to main run these tests through publish.yml.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in gleam.toml, and the latest.
        gleam: ["1.14.0", "1.18.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
        if: matrix.gleam == '1.18.1'
